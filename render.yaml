services:
  - type: web
    name: crypto-signal-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.3-70b-instruct
