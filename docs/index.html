<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0C10;
    --panel: #12151B;
    --panel-border: #21252E;
    --text: #E7EAF0;
    --muted: #6B7180;
    --long: #23D18B;
    --short: #F5486B;
    --neutral: #F0B90B;
    --accent: #4C8DFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    letter-spacing: 0.02em;
    margin: 0;
    font-weight: 700;
  }
  header h1 span { color: var(--accent); }
  #meta { color: var(--muted); font-size: 12px; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  section { margin-bottom: 36px; }
  .section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin: 0 0 14px 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .card.LONG::before { background: var(--long); }
  .card.SHORT::before { background: var(--short); }
  .card.NEUTRAL::before { background: var(--neutral); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .symbol {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
  }
  .exchange { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .direction-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.04em;
  }
  .direction-badge.LONG { color: var(--long); background: rgba(35,209,139,0.12); }
  .direction-badge.SHORT { color: var(--short); background: rgba(245,72,107,0.12); }
  .direction-badge.NEUTRAL { color: var(--neutral); background: rgba(240,185,11,0.12); }
  .price { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .price b { color: var(--text); }
  .meter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .meter-track {
    flex: 1;
    height: 6px;
    background: #1B1F27;
    border-radius: 3px;
    overflow: hidden;
  }
  .meter-fill { height: 100%; border-radius: 3px; }
  .meter-fill.LONG { background: var(--long); }
  .meter-fill.SHORT { background: var(--short); }
  .meter-fill.NEUTRAL { background: var(--neutral); }
  .confidence-num { font-size: 13px; font-weight: 600; min-width: 42px; text-align: right; }
  .rationale {
    font-size: 12.5px;
    line-height: 1.55;
    color: #A9AEBB;
    border-top: 1px dashed var(--panel-border);
    padding-top: 10px;
  }
  .trend-tag { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .arb-list { display: flex; flex-direction: column; gap: 8px; }
  .arb-item {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
  }
  .arb-spread {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: var(--long);
  }
  .arb-route { color: var(--muted); font-size: 12px; }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    border: 1px dashed var(--panel-border);
    border-radius: 8px;
    text-align: center;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 20px;
    border-top: 1px solid var(--panel-border);
  }
</style>
</head>
<body>
<header>
  <h1>Signal<span>Desk</span></h1>
  <div id="meta">last updated: —</div>
</header>

<main>
  <section>
    <div class="section-label">Directional Signals</div>
    <div class="grid" id="signals-grid">
      <div class="empty-state">Loading signals…</div>
    </div>
  </section>

  <section>
    <div class="section-label">Arbitrage Watch</div>
    <div class="arb-list" id="arb-list">
      <div class="empty-state">Loading arbitrage scan…</div>
    </div>
  </section>
</main>

<footer>
  Rule-based technical signals, not financial advice. Confidence reflects indicator agreement, not a guarantee of outcome.
</footer>

<script>
  const REFRESH_MS = 120000; // data only changes when the GitHub Action runs (~every 30 min), no need to poll fast

  function fmtTime(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleTimeString();
  }

  function renderSignals(signals) {
    const grid = document.getElementById('signals-grid');
    if (!signals || signals.length === 0) {
      grid.innerHTML = '<div class="empty-state">No signals yet — check back shortly.</div>';
      return;
    }
    grid.innerHTML = signals.map(s => {
      const dir = s.signal.direction;
      const conf = s.signal.confidence_pct;
      const price = s.price !== null ? s.price.toLocaleString(undefined, {maximumFractionDigits: 4}) : '—';
      return `
        <div class="card ${dir}">
          <div class="card-top">
            <div>
              <div class="symbol">${s.symbol}</div>
              <div class="exchange">${s.exchange}</div>
            </div>
            <div class="direction-badge ${dir}">${dir}</div>
          </div>
          <div class="price">last price <b>$${price}</b></div>
          <div class="meter-row">
            <div class="meter-track"><div class="meter-fill ${dir}" style="width:${conf}%"></div></div>
            <div class="confidence-num">${conf}%</div>
          </div>
          <div class="trend-tag">market: ${s.signal.trend_strength}</div>
          <div class="rationale">${s.rationale}</div>
        </div>
      `;
    }).join('');
  }

  function renderArbitrage(opps) {
    const list = document.getElementById('arb-list');
    if (!opps || opps.length === 0) {
      list.innerHTML = '<div class="empty-state">No spreads above threshold right now.</div>';
      return;
    }
    list.innerHTML = opps.map(o => `
      <div class="arb-item">
        <div>
          <b>${o.symbol}</b>
          <span class="arb-route"> · buy ${o.buy_exchange} @ ${o.buy_price} → sell ${o.sell_exchange} @ ${o.sell_price}</span>
        </div>
        <div class="arb-spread">+${o.est_net_spread_pct}% net</div>
      </div>
    `).join('');
  }

  async function refresh() {
    try {
      const [sigRes, arbRes] = await Promise.all([
        fetch('./data/signals.json?t=' + Date.now()).then(r => r.json()),
        fetch('./data/arbitrage.json?t=' + Date.now()).then(r => r.json())
      ]);
      renderSignals(sigRes.signals);
      renderArbitrage(arbRes.opportunities);
      document.getElementById('meta').textContent = 'last updated: ' + fmtTime(sigRes.last_updated);
    } catch (e) {
      console.error('Refresh failed', e);
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
